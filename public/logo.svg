<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="40" fill="#090D16" />

  <!-- Isometric Cube Framework -->
  <g transform="translate(250, 230)">
    <!-- Top Face -->
    <polygon points="0,-120 110,-55 0,10 -110,-55" fill="#1E293B" stroke="#38BDF8" stroke-width="4" />
    
    <!-- Left Face -->
    <polygon points="-110,-55 0,10 0,130 -110,65" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
    
    <!-- Right Face -->
    <polygon points="0,10 110,-55 110,65 0,130" fill="#1E293B" stroke="#38BDF8" stroke-width="4" />

    <!-- Git Branch Overlay on Top Face -->
    <circle cx="0" cy="-60" r="8" fill="#14B8A6" />
    <circle cx="-50" cy="-35" r="8" fill="#38BDF8" />
    <circle cx="50" cy="-35" r="8" fill="#38BDF8" />
    <line x1="0" y1="-60" x2="-50" y2="-35" stroke="#14B8A6" stroke-width="4" />
    <line x1="0" y1="-60" x2="50" y2="-35" stroke="#14B8A6" stroke-width="4" />

    <!-- Code Lines on Front Left Face -->
    <line x1="-80" y1="0" x2="-30" y2="25" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="-80" y1="25" x2="-45" y2="42" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="-80" y1="50" x2="-20" y2="80" stroke="#14B8A6" stroke-width="6" stroke-linecap="round" />

    <!-- Code Lines on Front Right Face -->
    <line x1="20" y1="25" x2="80" y2="-5" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="45" y1="42" x2="80" y2="25" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
